{{define "title"}}Carte{{end}}

{{define "content"}}
<style>
  /* Carte pleine page : main occupe toute la largeur et la hauteur sous le header. */
  main { max-width:none; margin:0; padding:0; height:calc(100vh - 64px); }
  @media (max-width:800px) { main { height:calc(100vh - 82px); } }

  /* Charte « Salut, comment vas-tu ? » — carte & modales */
  .map-wrap { position:relative; height:100%; }
  #map { width:100%; height:100%; background:var(--highlight); }

  /* Infobulle de survol : juste le nom, tout petit. */
  .leaflet-tooltip.map-tip {
    background:var(--sc-blanc); border:2px solid var(--border); border-radius:8px;
    padding:.25rem .55rem; font-size:.75rem; font-weight:var(--sc-font-weight-bold);
    color:var(--ink); box-shadow:none;
  }
  .leaflet-tooltip.map-tip::before { display:none; }

  /* Clusters : pastilles vertes façon charte. */
  .map-cluster { background:transparent; }
  .map-cluster div {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:#009850; color:#fff; border:2.5px solid var(--sc-blanc);
    border-radius:50%; font-size:.78rem; font-weight:var(--sc-font-weight-extrabold);
    box-shadow:0 0 0 1px rgba(24,24,24,.15);
  }

  /* Contrôle « vue Doubs » : bouton calqué sur les contrôles Leaflet. */
  .map-home-btn {
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border:2px solid rgba(0,0,0,.2); border-radius:4px;
    background:#fff; cursor:pointer; color:#333; padding:0;
  }
  .map-home-btn:hover { background:#f4f4f4; }

  /* Modal établissement — bulle organique façon charte */
  .etab-modal { position:fixed; inset:0; z-index:1000; display:flex; align-items:flex-end; justify-content:center; }
  .etab-modal[hidden] { display:none; }
  .etab-backdrop { position:absolute; inset:0; background:rgba(24,24,24,.5); }
  .etab-panel {
    position:relative; background:var(--sc-blanc); width:100%; max-width:640px;
    max-height:85dvh; border-radius:24px 24px 0 0; border:3px solid var(--border); border-bottom:none;
    display:flex; flex-direction:column; animation:slideup .2s ease;
  }
  @keyframes slideup { from { transform:translateY(30px); opacity:0; } to { transform:none; opacity:1; } }
  .etab-close {
    position:absolute; top:8px; right:12px; z-index:2; border:2px solid var(--border);
    background:var(--sc-jaune-signature); font-size:1.6rem; line-height:1; cursor:pointer;
    border-radius:50%; width:36px; height:36px; color:var(--ink); font-family:inherit;
  }
  .etab-close:hover { background:var(--sc-orange-desaccord); }
  .etab-body { overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }
  .etab-img { width:100%; height:200px; object-fit:cover; display:block; border-radius:22px 22px 0 0; }
  .etab-content { padding:1rem 1.25rem 1.5rem; }
  .etab-content h2 { margin:.2rem 0 .6rem; font-size:1.25rem; font-weight:var(--sc-font-weight-extrabold); letter-spacing:-0.01em; }
  .etab-tags { display:flex; flex-wrap:wrap; gap:.35rem; margin-bottom:.6rem; }
  .etab-tag {
    background:var(--sc-lilas); color:var(--ink); font-size:.72rem; padding:.15rem .55rem;
    border-radius:999px; font-weight:var(--sc-font-weight-bold); border:1px solid var(--border);
  }
  .etab-meta { color:var(--muted); font-size:.85rem; margin:0 0 .8rem; }
  .etab-meta a { color:var(--accent); }
  .etab-md { font-size:.95rem; line-height:1.6; }
  .etab-md h2, .etab-md h3 { font-size:1rem; margin:1rem 0 .4rem; font-weight:var(--sc-font-weight-bold); }
  .etab-md p { margin:.4rem 0; }
  .etab-md ul { margin:.4rem 0; padding-left:1.2rem; }
  .etab-md blockquote {
    margin:.6rem 0; padding:.5rem .8rem; background:var(--sc-jaune-signature);
    border-left:4px solid var(--sc-orange-desaccord); border-radius:0 8px 8px 0; font-size:.9rem;
  }
  .etab-loading { padding:2rem; text-align:center; color:var(--muted); }
  @media (min-width:640px) {
    .etab-modal { align-items:center; }
    .etab-panel { border-radius:24px; border-bottom:3px solid var(--border); max-height:80dvh; }
    .etab-img { border-radius:22px 22px 0 0; }
  }
</style>

<div class="map-wrap">
  <div id="map"></div>
</div>

<div id="etab-modal" class="etab-modal" hidden>
  <div class="etab-backdrop" data-close></div>
  <div class="etab-panel" role="dialog" aria-modal="true">
    <button class="etab-close" data-close aria-label="Fermer">×</button>
    <div id="etab-body" class="etab-body">Chargement…</div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// Carte en Leaflet + markercluster : clusters et spiderfy (rosette avec
// traits de liaison) gérés par la librairie — aucune surcouche maison.
const map = L.map('map', { zoomControl: true }).setView([47.23, 6.02], 9);

L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/light-v11/tiles/{z}/{x}/{y}?access_token={{.MapboxToken}}', {
  tileSize: 512,
  zoomOffset: -1,
  attribution: '© Mapbox © OpenStreetMap'
}).addTo(map);

// Pin bleu étoilé (charte)
const pinIcon = L.icon({
  iconUrl: '/static/marker/default.png',
  iconSize: [33, 44],
  iconAnchor: [17, 44],
  tooltipAnchor: [0, -42]
});

// Groupe clusterisé : pastilles vertes, spiderfy au clic (pins superposées).
const clusters = L.markerClusterGroup({
  maxClusterRadius: 36,
  spiderfyOnMaxZoom: true,
  spiderfyDistance: 55,
  spiderfyShapeOptions: { color: '#181818', weight: 1.5, opacity: 0.65 },
  showCoverageOnHover: false,
  iconCreateFunction: (cluster) => {
    const n = cluster.getChildCount();
    const size = n < 10 ? 30 : (n < 50 ? 38 : 46);
    return L.divIcon({
      html: '<div><span>' + n + '</span></div>',
      className: 'map-cluster',
      iconSize: [size, size]
    });
  }
});

// Modale fiche établissement
const modal = document.getElementById('etab-modal');
const modalBody = document.getElementById('etab-body');

function closeEtabModal() {
  modal.hidden = true;
  document.body.style.overflow = '';
}

async function openEtabModal(featureId) {
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  modalBody.innerHTML = '<div class="etab-loading">Chargement…</div>';
  try {
    const res = await fetch('/api/map/feature/' + featureId);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    const subcats = (d.subcategories || []).map(s => '<span class="etab-tag">' + s + '</span>').join('');
    const tel = d.phone ? '<a href="tel:' + d.phone.replace(/\s/g, '') + '">' + d.phone + '</a>' : '';
    const web = d.website ? ' · <a href="' + d.website + '" target="_blank" rel="noopener">Site web</a>' : '';
    modalBody.innerHTML =
      (d.image ? '<img class="etab-img" src="' + d.image + '" alt="" loading="lazy">' : '') +
      '<div class="etab-content">' +
        '<h2>' + (d.title || d.name) + '</h2>' +
        (subcats ? '<div class="etab-tags">' + subcats + '</div>' : '') +
        (d.address ? '<p class="etab-meta">📍 ' + d.address + (tel ? ' · 📞 ' + tel : '') + web + '</p>' : '') +
        '<div class="etab-md">' + (d.content_html || '') + '</div>' +
      '</div>';
  } catch (e) {
    modalBody.innerHTML = '<div class="etab-loading">Erreur de chargement de la fiche.</div>';
  }
}

modal.addEventListener('click', (e) => {
  if (e.target.hasAttribute('data-close')) closeEtabModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modal.hidden) closeEtabModal();
});

// Données : canton (zones) + établissements (pins clusterisés). Affichage fixe.
Promise.all([
  fetch('/api/map/categories').then(r => r.json()),
  fetch('/api/map/features').then(r => r.json())
]).then(([categories, geojson]) => {
  const cats = {};
  for (const c of categories) cats[c.code] = c;

  // Zones : canton (fond + contour)
  L.geoJSON(geojson, {
    filter: (f) => f.properties.category === 'canton',
    style: (f) => {
      const c = cats[f.properties.category] || {};
      return {
        color: c.stroke_color || c.color || '#555',
        weight: 2,
        fillColor: c.color || '#888',
        fillOpacity: 0.22
      };
    }
  }).addTo(map);

  // Établissements : pin + infobulle (nom) + fiche au clic
  for (const f of geojson.features) {
    if (f.geometry.type !== 'Point' || f.properties.category !== 'etablissement') continue;
    const [lng, lat] = f.geometry.coordinates;
    const m = L.marker([lat, lng], { icon: pinIcon, title: f.properties.name || '' });
    if (f.properties.name) {
      m.bindTooltip(f.properties.name, { direction: 'top', className: 'map-tip', opacity: 1 });
    }
    if (f.properties.id) {
      m.on('click', () => openEtabModal(f.properties.id));
    }
    clusters.addLayer(m);
  }
  map.addLayer(clusters);

  // Vue Doubs : le cadrage du chargement (fit sur le polygone du département).
  const dept = geojson.features.find(f => f.properties.category === 'departement');
  function vueDoubs() {
    if (!dept) return;
    map.fitBounds(L.geoJSON(dept).getBounds(), { padding: [40, 40] });
  }

  const VueDoubs = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const btn = L.DomUtil.create('button', 'map-home-btn');
      btn.type = 'button';
      btn.title = 'Revenir à la vue du Doubs';
      btn.setAttribute('aria-label', 'Revenir à la vue du Doubs');
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v4.5M12 17v4.5M2.5 12H7M17 12h4.5"/></svg>';
      L.DomEvent.on(btn, 'click', (e) => { L.DomEvent.stop(e); vueDoubs(); });
      L.DomEvent.disableClickPropagation(btn);
      return btn;
    },
    onRemove: function () {}
  });
  map.addControl(new VueDoubs());

  // Vue initiale : celle demandée en URL (?lat=&lng=&z=) ou le Doubs.
  const qs = new URLSearchParams(location.search);
  const lat = parseFloat(qs.get('lat'));
  const lng = parseFloat(qs.get('lng'));
  const z = parseFloat(qs.get('z'));
  if (isFinite(lat) && isFinite(lng) && isFinite(z)) {
    map.setView([lat, lng], z);
  } else {
    vueDoubs();
  }

  // Le conteneur prend sa taille finale en fin de rendu : Leaflet doit
  // recalculer ses dimensions, sinon la carte ne remplit pas la hauteur.
  requestAnimationFrame(() => map.invalidateSize());
});
</script>
{{end}}

{{template "base" .}}
