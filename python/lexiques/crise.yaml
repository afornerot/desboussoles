# Lexique de crise — composant de sécurité, indépendant du LLM.
# Regex RE2 appliquées au texte normalisé (minuscules, SANS accents, abréviations SMS développées).
# Les accents écrits ici sont retirés au chargement. Langage courant, pas clinique.
niveau_3:   # plan, moyen, imminence, danger immédiat
  - "ce soir je (vais|le fais|vais le faire|vais en finir|me tue)"
  - "j'ai (pris|avalé) (tous |toutes |une boite de |la boite de |plein de |trop de )?(les |mes |des |de )?(cachets|médocs|comprimés|médicaments|pilules)"
  - "j'ai (préparé|écrit) (une|ma) lettre"
  - "j'ai (une corde|un flingue|une arme|un fusil)"
  - "(sauter|me jeter) (du|d'un|par la|de la|sous un|sous le) ?(pont|fenêtre|balcon|immeuble|train|toit)"
  - "il va me tuer"
  - "(me|nous) (frappe|tape|menace|bat) (encore|en ce moment|là|maintenant)"
  - "(il|elle) (a|avait) (une corde|un flingue|une arme|un fusil)"
  - "(une corde|un flingue|une arme|un fusil) (chez (lui|elle|moi)|dans (sa|ma) chambre)"
  - "je suis en danger"
  - "(je vais|j'vais) (me tuer|me suicider|en finir|sauter)"
  - "c'est (prévu|décidé) pour (ce soir|demain)"
  - "je suis sur le pont"
niveau_2:   # idées suicidaires / auto-agression / violences en cours
  - "(me|se|te) (suicider|tuer|foutre en l'air)"
  - "\\bsu[iy]?[cs]{1,2}[iy]?d"          # suicide, sucide, suiside, suicidaire…
  - "en finir"
  - "(plus|pas) envie de vivre"
  - "envie de mourir"
  - "(veux|veut|voulait|voudrais|voudrait|aimerais|aimerait|préfère|prefererais) mourir"
  - "mieux (mort|morte)"
  - "(disparaître|disparaitre) (pour toujours|de la surface)"
  - "(ce serait|ça serait|ca serait) mieux (sans moi|si j'étais plus là|si j'etais plus la)"
  - "(me|se) (faire|ferai|ferais|fait|fais) du mal"
  - "(me|se) (scarifier|scarifie|mutiler|mutile|couper les veines)"
  - "(je|il|elle) (me|se) (scarifie|coupe|mutile)"
  - "se (scarifie|coupe les bras|coupe les poignets)"
  - "tout arrêter"
  - "plus la force de continuer"
  - "plus la force de (me battre|lutter)"
  - "idées? noires?"
  - "idées? sombres?"
  - "mon enterrement"
  - "(aucune|pas|plus) envie d'(être|etre) (là|la)\\b"
  - "(ne plus|plus jamais) (me|se) réveiller"
  - "(je veux|j'ai envie de) (dormir pour toujours|partir pour toujours)"
  - "(mon mari|mon copain|mon conjoint|mon compagnon|mon ex|ma femme|ma copine|mon père|ma mère|il|elle) (me|nous) (frappe|tape|bat|menace|étrangle)"
  - "(il|elle) (me|nous) (a frappé|a tapé|a battu|a menacé)"
  - "(frappe|tape|bat) (ma|mon|mes|notre|nos) (fille|fils|petite|petit|soeur|frère|enfant|enfants|mère|gamin|gamine|bébé)"
  - "(j'ai|il a|elle a) fait une (tentative|ts)\\b"
niveau_1:   # détresse
  - "j'en peux plus"
  - "(je craque|je pète un câble|je pete les plombs|je pète les plombs)"
  - "(ça|ca) va (pas|plus) du tout"
  - "(ça|ca) va pas fort"
  - "je (dors|mange) plus"
  - "je pleure tout le temps"
  - "personne (m'écoute|me comprend)"
  - "je suis (à bout|au bout du rouleau|épuisé|épuisée|vidé|vidée)"
  - "(je n'arrive|j'arrive|jarrive) plus à rien"
  - "plus goût à rien"
  - "(je me sens|je suis) (seul|seule|nul|nulle)\\b"
  - "je (vais|me sens) (pas bien|mal)"
  - "je tiens plus"
  - "j'en ai marre"
  - "aucune énergie"
