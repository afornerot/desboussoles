services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres-qgis
    environment:
      POSTGRES_USER: boussoule
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: boussole
    ports:
      - "5432:5432"
    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boussoule -d boussole"]
      interval: 10s
      timeout: 5s
      retries: 5

  boussole:
    build: ./server
    container_name: boussole-web
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://boussoule:changeme@postgres:5432/boussole?sslmode=disable
      LISTEN_ADDR: ":8080"
      MAPBOX_TOKEN: ""
      GUIDE_API_URL: "http://guide-api:8000"
      AI_PROVIDER: ""
      AI_MODEL: ""
      AI_API_KEY: ""
      AI_BASE_URL: ""
    volumes:
      - ./data/guide.md:/data/guide.md:ro
      - ./data/traces:/data/traces
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # API Guide (questionnaire d'orientation) — FastAPI, sessions en mémoire
  guide-api:
    build: ./api-guide
    container_name: guide-api
    ports:
      - "8002:8000"
    environment:
      SEUIL_ALERTE: "3"
    restart: unless-stopped

# Sous-réseau épinglé : hors des pools automatiques de Docker (172.x / 192.168.x)
# pour éviter toute collision avec le LAN de la machine hôte (route plus spécifique
# qui détourne les IP containers et rend les ports publiés inaccessibles).
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.250.0/24