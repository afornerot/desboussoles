services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres-qgis
    environment:
      POSTGRES_USER: boussoule
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: boussole
    ports:
      - "5432:5432"
    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boussoule -d boussole"]
      interval: 10s
      timeout: 5s
      retries: 5

  boussole:
    build: ./app
    container_name: boussole-web
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://boussoule:changeme@postgres:5432/boussole?sslmode=disable
      LISTEN_ADDR: ":8080"
      MAPBOX_TOKEN: ""
      GUIDE_API_URL: ""
      AI_PROVIDER: ""
      AI_MODEL: ""
      AI_API_KEY: ""
      AI_BASE_URL: ""
    volumes:
      - ./guide.md:/data/guide.md:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped